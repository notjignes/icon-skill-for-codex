name: Validate UC Icons

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/verify_legacy_pixel_equivalence.py
      - run: python uc-icons/scripts/validate_uc_icons.py --compact-baseline
      - run: python uc-icons/scripts/manage_reference_bank.py validate
